# Fuerza Bun para install/build/start (sin esto Nixpacks usa npm por defecto).
# Node 20 explícito — NO usar "..." (auto-detectaba nodejs_18, ya removido de
# nixpkgs por EOL). Node se necesita en runtime: start corre `node ./dist/server/entry.mjs`.
[phases.setup]
nixPkgs = ["nodejs_20", "bun"]

[phases.install]
cmds = ["bun install --frozen-lockfile"]

[phases.build]
cmds = ["bun run build"]

[start]
cmd = "bun run start"
